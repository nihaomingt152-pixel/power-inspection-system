<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 电力巡检系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
        <!-- 登录卡片 -->
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm" id="login-card">
                <div class="card-body p-4">
                    <h3 class="text-center mb-3">⚡ 电力巡检系统</h3>
                    <h5 class="text-center text-muted mb-4">用户登录</h5>
                    <div id="login-error" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" id="login-username" class="form-control" placeholder="请输入用户名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" id="login-password" class="form-control" placeholder="请输入密码">
                    </div>
                    <button class="btn btn-primary w-100" onclick="doLogin()">登录</button>
                    <p class="text-center mt-3 mb-0">
                        <small>没有账号？<a href="#" onclick="showRegister()">注册新账号</a></small>
                    </p>
                    <p class="login-hint mt-3 mb-0">预置账号：<strong>admin/123456</strong>（运维） · <strong>worker/123456</strong>（检修）</p>
                </div>
            </div>

            <!-- 注册卡片 -->
            <div class="card shadow-sm d-none" id="register-card">
                <div class="card-body p-4">
                    <h5 class="text-center mb-4">注册新账号</h5>
                    <div id="reg-error" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" id="reg-username" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码（至少4位，最长72字符）</label>
                        <input type="password" id="reg-password" class="form-control" minlength="4">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认密码</label>
                        <input type="password" id="reg-password-confirm" class="form-control">
                        <div class="invalid-feedback" id="pwd-match-error">两次密码不一致</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">姓名</label>
                        <input type="text" id="reg-fullname" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">角色</label>
                        <select id="reg-role" class="form-select">
                            <option value="inspector">运维人员 (inspector)</option>
                            <option value="repairman">检修人员 (repairman)</option>
                        </select>
                    </div>
                    <button class="btn btn-success w-100" onclick="doRegister()">注册</button>
                    <p class="text-center mt-3 mb-0">
                        <small>已有账号？<a href="#" onclick="showLogin()">返回登录</a></small>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
