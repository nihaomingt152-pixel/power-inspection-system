<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS 地图总览 - 电力巡检系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        #map { height: calc(100vh - 56px); width: 100%; }
        .map-container { position: relative; }
        .map-legend {
            position: absolute; bottom: 20px; right: 20px; z-index: 1000;
            background: rgba(255,255,255,0.95); padding: 10px 14px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 13px;
        }
        .map-legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    </style>
</head>
<body class="map-page">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/"><span class="brand-mark">⚡</span> 电力巡检系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav2">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav2">
            <ul class="navbar-nav me-auto" id="nav-menu"></ul>
            <span class="navbar-text me-3" id="nav-user"></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="map-container">
    <div id="map"></div>
    <div class="map-legend">
        <div class="map-legend-title">图例</div>
        <div class="map-legend-group">
            <div class="map-legend-group-label">风险等级</div>
            <div class="map-legend-item"><span class="legend-dot" style="background:#34c759;"></span>一般</div>
            <div class="map-legend-item"><span class="legend-dot" style="background:#ff9f0a;"></span>严重</div>
            <div class="map-legend-item"><span class="legend-dot" style="background:#ff3b30;"></span>紧急</div>
        </div>
        <div class="map-legend-group">
            <div class="map-legend-group-label">标记类型</div>
            <div class="map-legend-item"><span class="legend-dot" style="background:#8e8e93;"></span>检测记录</div>
            <div class="map-legend-item"><span class="legend-order-pin">📌</span>未闭环工单</div>
        </div>
        <div class="map-legend-note">未闭环工单包含状态：待派发 / 处理中 / 待复检 / 已驳回</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/map.js"></script>
</body>
</html>
