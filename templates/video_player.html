<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放 - 电力巡检系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/"><span class="brand-mark">⚡</span> 电力巡检系统</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto" id="nav-menu"></ul>
            <span class="navbar-text me-3" id="nav-user"></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="container-fluid py-3">
    <h4 id="video-title">🎬 标注视频播放</h4>
    <div class="card">
        <div class="card-body text-center">
            <video id="main-video" controls autoplay style="max-width:100%;max-height:70vh;" src="">
                您的浏览器不支持 HTML5 视频播放
            </video>
        </div>
    </div>
    <div class="mt-2">
        <a href="/" class="btn btn-outline-primary">← 返回检测中心</a>
        <a id="btn-download" href="#" class="btn btn-outline-success" download>📥 下载视频</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/auth.js"></script>
<script>
    // 从 URL 提取 task_id 和时间参数
    const pathParts = window.location.pathname.split('/');
    const taskId = pathParts[pathParts.length - 1];
    const urlParams = new URLSearchParams(window.location.search);
    const jumpTime = parseFloat(urlParams.get('time')) || 0;

    document.addEventListener('DOMContentLoaded', async () => {
        // 认证
        try {
            const user = await getCurrentUser();
            if (user) {
                document.getElementById('nav-user').textContent = `👤 ${user.full_name || user.username} (${user.role})`;
                renderNavMenu(user, 'index');
            }
        } catch(e) {}

        // 加载视频信息
        try {
            // 通过 task_id 查找对应的视频检测记录
            const d = await apiGet(`/api/video/progress/${taskId}`);
            if (d.success && d.data.output_video_path) {
                const videoSrc = d.data.output_video_path.startsWith('/') ? d.data.output_video_path : '/' + d.data.output_video_path;
                const video = document.getElementById('main-video');
                video.src = videoSrc;
                const btn = document.getElementById('btn-download');
                btn.href = '/api/export/video/' + videoSrc.split('/').pop();

                if (d.data.original_filename) {
                    document.getElementById('video-title').textContent = '🎬 ' + d.data.original_filename;
                }
            }
        } catch(e) { console.error('加载视频失败', e); }
    });

    // 视频就绪后跳转到指定时间
    document.getElementById('main-video').addEventListener('loadedmetadata', function() {
        if (jumpTime > 0) {
            this.currentTime = jumpTime;
            this.play().catch(() => {});
        }
    });
</script>
</body>
</html>
